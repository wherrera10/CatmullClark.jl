name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
env:
  JULIA_NUM_THREADS: 2
jobs:
  test:
    name: Julia - ${{ github.event_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      
      # Install Xvfb and Mesa OpenGL utilities on the runner
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      # Run tests inside a virtual frame buffer
      - name: Run tests with virtual display
        run: |
          xvfb-run --auto-servernum julia --color=yes --project=@. -e 'using Pkg; Pkg.test(; coverage=true)'
        
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
        with:
          file: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      
      # Install Xvfb and Mesa OpenGL utilities for Documenter build
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
            
      - name: Run doctests with virtual display
        run: |
          xvfb-run --auto-servernum julia --project=docs -e '
            using Documenter: doctest
            using CatmullClark
            doctest(CatmullClark)'
            
      - name: Build and deploy documentation with virtual display
        run: |
          xvfb-run --auto-servernum julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
